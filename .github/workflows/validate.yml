name: Validate Ansible

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and local tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_NOCOLOR: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install ansible-core==2.20.0
      - name: Check cluster playbook syntax
        run: |
          ansible-playbook -i ansible/inventory/runner-local.yml ansible/playbooks/cluster-cilium.yml --syntax-check
          ansible-playbook -i ansible/inventory/runner-local.yml ansible/playbooks/cluster-istio.yml --syntax-check
          ansible-playbook -i ansible/inventory/cilium.yml ansible/playbooks/add-workers.yml --syntax-check
      - name: Run local tests without infrastructure access
        run: python -m unittest discover -s tests -v
