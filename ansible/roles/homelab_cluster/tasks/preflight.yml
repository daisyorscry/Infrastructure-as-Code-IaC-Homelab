---
- name: Require a full inventory run and explicit operation
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - ansible_limit | default('') | length == 0
      - cluster_operation in ['init', 'join']
      - groups.get('k8s_control_plane', []) | length == 1
      - groups.get('k8s_workers', []) | length > 0
      - (groups.get('k8s_control_plane', []) | intersect(groups.get('k8s_workers', []))) | length == 0
      - workers is string or (workers is sequence and workers is not mapping)
      - join_workers is sequence and join_workers is not string and join_workers is not mapping
      - workers | length == 0 or join_workers | length == 0
      - cluster_operation != 'init' or join_workers | length == 0
    fail_msg: >-
      Run without --limit/check mode and use one control plane.
      Set workers as comma-separated inventory names or a YAML/JSON list.
      Do not combine workers with the legacy join_workers parameter.

- name: Validate the requested initial worker count
  ansible.builtin.assert:
    that:
      - worker_count | string is match('^[0-9]+$')
      - worker_count | int >= 4
      - worker_count | int <= groups['k8s_workers'] | length
    fail_msg: worker_count must be an integer >=4 workers and cannot exceed workers available in inventory.
  when: cluster_operation == 'init'

- name: Normalize worker input from the Semaphore form
  ansible.builtin.set_fact:
    requested_workers: "{{ (workers.split(',') | map('trim') | list) if workers is string and workers | trim | length > 0 else (workers if workers is not string else join_workers) }}"

- name: Validate explicit worker selection before resolving hosts
  ansible.builtin.assert:
    that:
      - requested_workers | difference(groups['k8s_workers']) | length == 0
      - requested_workers | unique | length == requested_workers | length
      - cluster_operation != 'join' or requested_workers | length > 0
      - cluster_operation != 'init' or requested_workers | length == 0 or requested_workers | length == worker_count | int
    fail_msg: >-
      Use known, unique worker inventory names without empty entries.
      Init requires exactly worker_count names when workers is filled.
      Join requires at least one worker in workers.

- name: Resolve exact hosts for this operation
  ansible.builtin.set_fact:
    selected_workers: "{{ requested_workers if requested_workers | length > 0 else (groups['k8s_workers'] | sort)[:worker_count | int] }}"

- name: Show the selected workers before guest access
  ansible.builtin.debug:
    msg:
      operation: "{{ cluster_operation }}"
      worker_count: "{{ selected_workers | length }}"
      workers: "{{ selected_workers }}"

- name: Validate pinned versions and cluster settings
  ansible.builtin.assert:
    that:
      - cluster_name is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - kubernetes_version is match('^1\.(35|36)\.[0-9]+$')
      - crio_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - crio_version.split('.')[0:2] == kubernetes_version.split('.')[0:2]
      - helm_version is match('^3\.[0-9]+\.[0-9]+$')
      - gateway_api_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - cluster_stack != 'cilium' or cilium_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - cluster_stack != 'istio' or calico_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - cluster_stack != 'istio' or istio_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - cluster_stack != 'istio' or metallb_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - l2_interfaces is sequence and l2_interfaces is not string and l2_interfaces | length > 0
      - l2_interfaces | reject('match', '^[a-zA-Z0-9_.:-]+$') | list | length == 0
      - gateway_namespace is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
      - gateway_name is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
      - gateway_hostname == '' or gateway_hostname is match('^(\*\.)?[a-z0-9][a-z0-9.-]+[a-z0-9]$')
    fail_msg: Check pinned versions, matching Kubernetes/CRI-O minor, cluster name, and gateway settings.

- name: Validate IPv4 ranges and inventory with the runner standard library
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - |
        import ipaddress, json, sys
        cfg = json.loads(sys.argv[1])
        pod = ipaddress.IPv4Network(cfg['pod'])
        svc = ipaddress.IPv4Network(cfg['service'])
        lan = ipaddress.IPv4Network(cfg['lan'])
        start, stop = [ipaddress.IPv4Address(cfg[k]) for k in ('start', 'stop')]
        assert not pod.overlaps(svc) and not pod.overlaps(lan) and not svc.overlaps(lan), 'Overlapping Pod/Service/LAN CIDRs'
        assert start in lan and stop in lan and int(start) <= int(stop), 'LB range must be inside node LAN'
        assert start not in (lan.network_address, lan.broadcast_address) and stop not in (lan.network_address, lan.broadcast_address), 'LB range includes reserved LAN address'
        ips = [ipaddress.IPv4Address(ip) for ip in cfg['hosts']]
        assert len(ips) == len(set(ips)), 'Duplicate inventory IPs'
        assert all(ip in lan and not int(start) <= int(ip) <= int(stop) for ip in ips), 'Node IP outside LAN or inside LB pool'
        assert pod.prefixlen <= 24 and 2 ** (24 - pod.prefixlen) >= len(ips), 'Pod CIDR needs at least one /24 per inventoried node'
      - "{{ {'pod': pod_cidr, 'service': service_cidr, 'lan': node_lan_cidr, 'start': lb_start_ip, 'stop': lb_stop_ip, 'hosts': (groups['k8s_control_plane'] + groups['k8s_workers']) | map('extract', hostvars, 'ansible_host') | list} | to_json }}"
  changed_when: false

- name: Require lowercase Kubernetes node names and stable IPs
  ansible.builtin.assert:
    that:
      - item is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - hostvars[item].ansible_host is defined
    fail_msg: Use lowercase hostnames and explicit stable IPv4 ansible_host values.
  loop: "{{ groups['k8s_control_plane'] + groups['k8s_workers'] }}"

- name: Register only selected machines for guest access
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: cluster_selected_nodes
  loop: "{{ cluster_node_targets }}"

- name: Mark successful controller-side validation
  ansible.builtin.set_fact:
    cluster_preflight_passed: true
