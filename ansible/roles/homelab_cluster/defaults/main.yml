---
cluster_flow: "{{ hostvars['localhost'].selected_flow }}"
# Init selects this many inventoried workers; the initial minimum remains four.
worker_count: 4
# Worker playbook only: choose a master inventory name and worker inventory names.
master: ''
workers: ''
cluster_stack: "{{ hostvars['localhost'].selected_stack }}"
cluster_control_plane: "{{ hostvars['localhost'].selected_master }}"
cluster_worker_targets: "{{ hostvars['localhost'].selected_workers }}"
cluster_node_targets: "{{ [cluster_control_plane] + cluster_worker_targets }}"
cluster_api_ip: "{{ hostvars[cluster_control_plane].ansible_host }}"
cluster_config_dir: /etc/kubernetes/homelab
cluster_profile_path: /etc/kubernetes/homelab/profile.json
cluster_cri_socket: unix:///var/run/crio/crio.sock
cluster_kubeconfig: /etc/kubernetes/admin.conf
cluster_kubernetes_minor: "v{{ kubernetes_version.split('.')[0:2] | join('.') }}"
cluster_helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
cluster_record:
  name: "{{ cluster_name }}"
  stack: "{{ cluster_stack }}"
  pod_cidr: "{{ pod_cidr }}"
  service_cidr: "{{ service_cidr }}"
  node_lan_cidr: "{{ node_lan_cidr }}"
  api_ip: "{{ cluster_api_ip }}"
  kubernetes_version: "{{ kubernetes_version }}"
  crio_version: "{{ crio_version }}"
  cilium_version: "{{ cilium_version if cluster_stack == 'cilium' else '' }}"
  calico_version: "{{ calico_version if cluster_stack == 'istio' else '' }}"
  istio_version: "{{ istio_version if cluster_stack == 'istio' else '' }}"
  metallb_version: "{{ metallb_version if cluster_stack == 'istio' else '' }}"
  gateway_api_version: "{{ gateway_api_version }}"
  lb_start_ip: "{{ lb_start_ip }}"
  lb_stop_ip: "{{ lb_stop_ip }}"
  l2_interfaces: "{{ l2_interfaces }}"
  gateway_namespace: "{{ gateway_namespace }}"
  gateway_name: "{{ gateway_name }}"
  gateway_hostname: "{{ gateway_hostname }}"
