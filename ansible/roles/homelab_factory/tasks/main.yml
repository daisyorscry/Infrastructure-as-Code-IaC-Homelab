---
- name: Freeze factory selection before dynamic inventory changes
  ansible.builtin.set_fact:
    factory_should_provision: "{{ cluster_provision_vms | bool }}"

- name: Explain why VM provisioning is disabled
  ansible.builtin.debug:
    msg: >-
      VM provisioning is disabled. Existing k8s_control_plane/k8s_workers groups
      select bootstrap of existing VMs, or cluster_provision_vms was set false.
      To create VMs use a localhost-only runner inventory and remove any false override.
      Semaphore static inventories must be updated in Semaphore itself.
  when: not factory_should_provision

- name: Provision the selected stack before any node access
  ansible.builtin.include_tasks:
    file: provision.yml
    apply:
      tags: [factory]
  when: factory_should_provision
