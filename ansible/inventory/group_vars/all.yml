---
# Defaults for a NEW cluster. Override per Semaphore template through Extra vars.
# Existing profile is checked before any guest changes; this is not an upgrade tool.
cluster_name: homelab
kubernetes_version: '1.35.9'
crio_version: '1.35.10'
helm_version: '3.20.0'
cilium_version: '1.20.4'
calico_version: 'v3.33.0'
istio_version: '1.31.3'
metallb_version: 'v0.16.1'
gateway_api_version: 'v1.6.3'

pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12
# LAN nodes use DHCP; reserve this Gateway/LB range outside the router DHCP pool.
# If both clusters run concurrently, give each a separate LB range via Extra vars.
node_lan_cidr: 192.168.10.0/24
lb_start_ip: 192.168.10.10
lb_stop_ip: 192.168.10.20
# Empty auto-detects each worker's interface toward the master. Set names to override.
l2_interfaces: []
gateway_namespace: gateway-system
gateway_name: homelab-gateway
# Empty accepts any hostname; set a domain if desired. Initial listener is HTTP :80.
gateway_hostname: ''
